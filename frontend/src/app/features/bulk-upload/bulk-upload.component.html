<div class="max-w-2xl mx-auto space-y-6">
  <h2 class="text-2xl font-bold text-gray-800">Bulk Product Upload</h2>
  
  <div class="bg-white rounded-lg shadow-md p-8 text-center">
    <div *ngIf="!isUploading && !uploadComplete" class="space-y-4">
      <div class="flex items-center justify-center w-full">
        <label for="dropzone-file" class="flex flex-col items-center justify-center w-full h-64 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100">
          <div class="flex flex-col items-center justify-center pt-5 pb-6">
            <svg class="w-10 h-10 mb-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
            <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">Click to upload</span> or drag and drop</p>
            <p class="text-xs text-gray-500">CSV files only</p>
          </div>
          <input id="dropzone-file" type="file" class="hidden" accept=".csv" (change)="onFileSelected($event)" />
        </label>
      </div>
      <div class="text-left">
        <h4 class="font-medium text-gray-700 mb-2">Instructions:</h4>
        <ul class="list-disc list-inside text-sm text-gray-600 space-y-1">
          <li>File must be in CSV format.</li>
          <li>Required columns: Name, Price, Category, Stock.</li>
          <li>Maximum file size: 5MB.</li>
        </ul>
      </div>
    </div>

    <div *ngIf="isUploading" class="space-y-4">
      <h3 class="text-lg font-medium text-gray-900">Uploading...</h3>
      <div class="w-full bg-gray-200 rounded-full h-2.5">
        <div class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" [style.width.%]="progress"></div>
      </div>
      <p class="text-sm text-gray-500">{{ progress }}%</p>
    </div>

    <div *ngIf="uploadComplete" class="space-y-4">
      <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-green-100">
        <svg class="h-6 w-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
      </div>
      <h3 class="text-lg font-medium text-gray-900">Upload Successful!</h3>
      <p class="text-sm text-gray-500">Processed 150 products successfully.</p>
      <button (click)="reset()" class="mt-4 inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
        Upload Another File
      </button>
    </div>
  </div>
</div>
