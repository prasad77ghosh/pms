<div class="space-y-6">
  <div class="flex justify-between items-center">
    <h2 class="text-2xl font-bold text-gray-800">Categories</h2>
    <a routerLink="/categories/create" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition shadow-sm">
      Add Category
    </a>
  </div>

  <app-table 
    [data]="categories()" 
    [columns]="columns" 
    [total]="total()" 
    [page]="page()" 
    [limit]="limit()"
    (pageChange)="onPageChange($event)"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)">
  </app-table>

  <app-modal 
    [isOpen]="isDeleteModalOpen" 
    title="Delete Category" 
    confirmText="Delete" 
    cancelText="Cancel"
    (closeEvent)="isDeleteModalOpen = false" 
    (confirmEvent)="confirmDelete()">
    <p class="text-gray-600">Are you sure you want to delete this category?</p>
  </app-modal>
</div>
