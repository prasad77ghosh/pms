<div class="space-y-6">
  <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
    <h2 class="text-2xl font-bold text-gray-800">Products</h2>
    <div class="flex gap-2">
      <button (click)="openBulkUploadModal()" 
              class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg transition shadow-sm flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
        </svg>
        Bulk Upload
      </button>
      <button (click)="downloadReport()" 
              [disabled]="isGeneratingReport()"
              class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition shadow-sm disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
        <span *ngIf="isGeneratingReport()" class="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></span>
        {{ isGeneratingReport() ? 'Generating...' : 'Download Report' }}
      </button>
      <a routerLink="/products/create" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition shadow-sm">
        Add Product
      </a>
    </div>
  </div>

  <!-- Filters -->
  <div class="bg-white p-4 rounded-lg shadow-sm flex flex-col sm:flex-row gap-4">
    <div class="flex-1">
      <input type="text" [(ngModel)]="searchTerm" (ngModelChange)="onSearch($event)" 
             placeholder="Search products..." 
             class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
    </div>
    <!-- Add Category Filter here if needed -->
  </div>

  <app-table 
    [data]="products()" 
    [columns]="columns" 
    [total]="total()" 
    [page]="page()" 
    [limit]="limit()"
    (sort)="onSort($event)"
    (pageChange)="onPageChange($event)"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)">
  </app-table>

  <app-modal 
    [isOpen]="isDeleteModalOpen" 
    title="Delete Product" 
    confirmText="Delete" 
    cancelText="Cancel"
    (closeEvent)="isDeleteModalOpen = false" 
    (confirmEvent)="confirmDelete()">
    <p class="text-gray-600">Are you sure you want to delete this product? This action cannot be undone.</p>
  </app-modal>

  <app-bulk-upload-modal
    [isOpen]="isBulkUploadModalOpen"
    (closeEvent)="isBulkUploadModalOpen = false"
    (uploadSuccess)="onBulkUploadSuccess()">
  </app-bulk-upload-modal>
</div>
