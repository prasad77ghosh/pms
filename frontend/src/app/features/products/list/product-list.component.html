<div class="space-y-6">
  <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
    <h2 class="text-2xl font-bold text-gray-800">Products</h2>
    <a routerLink="/products/create" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition shadow-sm">
      Add Product
    </a>
  </div>

  <!-- Filters -->
  <div class="bg-white p-4 rounded-lg shadow-sm flex flex-col sm:flex-row gap-4">
    <div class="flex-1">
      <input type="text" [(ngModel)]="searchTerm" (ngModelChange)="onSearch($event)" 
             placeholder="Search products..." 
             class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
    </div>
    <!-- Add Category Filter here if needed -->
  </div>

  <app-table 
    [data]="products()" 
    [columns]="columns" 
    [total]="total()" 
    [page]="page()" 
    [limit]="limit()"
    (sort)="onSort($event)"
    (pageChange)="onPageChange($event)"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)">
  </app-table>

  <app-modal 
    [isOpen]="isDeleteModalOpen" 
    title="Delete Product" 
    confirmText="Delete" 
    cancelText="Cancel"
    (closeEvent)="isDeleteModalOpen = false" 
    (confirmEvent)="confirmDelete()">
    <p class="text-gray-600">Are you sure you want to delete this product? This action cannot be undone.</p>
  </app-modal>
</div>
