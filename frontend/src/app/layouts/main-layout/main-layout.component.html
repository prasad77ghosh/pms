<div class="h-screen overflow-hidden bg-gray-100 flex">
  
  <!-- Sidebar (Only if authenticated) -->
  <aside *ngIf="authService.isAuthenticated()" class="w-64 bg-white shadow-md hidden md:flex flex-col">
    <div class="p-6 border-b">
      <h1 class="text-2xl font-bold text-blue-600">PMS</h1>
    </div>
    <nav class="flex-1 p-4 space-y-2">
      <a routerLink="/products" routerLinkActive="bg-blue-50 text-blue-600" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg transition">
        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
        Products
      </a>
      <a routerLink="/categories" routerLinkActive="bg-blue-50 text-blue-600" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg transition">
        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
        Categories
      </a>
      <a routerLink="/users" routerLinkActive="bg-blue-50 text-blue-600" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg transition">
        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        Users
      </a>

    </nav>
    
    <div class="p-4 border-t">
      <button (click)="logout()" class="flex items-center w-full px-4 py-3 text-gray-700 hover:bg-red-50 hover:text-red-600 rounded-lg transition">
        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        Logout
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    
    <!-- Header -->
    <header class="bg-white shadow-sm z-10">
      <div class="flex items-center justify-between px-6 py-4">
        <h2 class="text-xl font-semibold text-gray-800">
          {{ !authService.isAuthenticated() ? 'Product Management System' : 'Dashboard' }}
        </h2>
        
        <div class="flex items-center gap-4">
          <ng-container *ngIf="authService.isAuthenticated(); else loginBtn">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold">
                {{ authService.currentUser()?.name?.charAt(0) || 'U' }}
              </div>
              <span class="text-sm font-medium text-gray-700">{{ authService.currentUser()?.name }}</span>
            </div>
            <button (click)="logout()" class="text-sm text-gray-500 hover:text-red-600 transition">Logout</button>
          </ng-container>
          <ng-template #loginBtn>
            <a routerLink="/auth/login" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
              Login
            </a>
          </ng-template>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
