<div class="overflow-x-auto bg-white shadow-md rounded-lg">
  <table class="min-w-full leading-normal">
    <thead>
      <tr>
        <th *ngFor="let col of columns"
            class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left 
                   text-xs font-semibold text-gray-600 uppercase tracking-wider
                   cursor-pointer hover:bg-gray-200 transition"
            (click)="col.sortable ? onSort(col) : null">

          <div class="flex items-center">
            {{ col.label }}

            <span *ngIf="col.sortable" class="ml-1">

              <!-- no active sorting -->
              <svg *ngIf="sortKey !== col.key" class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path>
              </svg>

              <!-- ASC -->
              <svg *ngIf="sortKey === col.key && sortDirection === 'asc'" class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M5 15l7-7 7 7"></path>
              </svg>

              <!-- DESC -->
              <svg *ngIf="sortKey === col.key && sortDirection === 'desc'" class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M19 9l-7 7-7-7"></path>
              </svg>

            </span>
          </div>

        </th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let row of data" class="hover:bg-gray-50 transition">
        <td *ngFor="let col of columns" class="px-5 py-5 border-b border-gray-200 text-sm">

          <!-- Text -->
          <span *ngIf="!col.type || col.type === 'text'" class="text-gray-900 whitespace-no-wrap">
            {{ row[col.key] }}
          </span>

          <!-- Currency -->
          <span *ngIf="col.type === 'currency'" class="text-gray-900 whitespace-no-wrap">
            {{ row[col.key] | currency }}
          </span>

          <!-- Date -->
          <span *ngIf="col.type === 'date'" class="text-gray-900 whitespace-no-wrap">
            {{ row[col.key] | date:'mediumDate' }}
          </span>

          <!-- Image -->
          <div *ngIf="col.type === 'image'" class="flex-shrink-0 w-10 h-10">
            <img [src]="row[col.key] || 'https://placehold.co/50'" 
                 (error)="row[col.key] = 'https://placehold.co/50'"
                 class="w-full h-full rounded-full object-cover border border-gray-200">
          </div>

          <!-- Actions -->
          <div *ngIf="col.type === 'actions'" class="flex gap-2">
            <button (click)="onEdit(row)" class="text-blue-600 hover:text-blue-900 font-medium">Edit</button>
            <button (click)="onDelete(row)" class="text-red-600 hover:text-red-900 font-medium">Delete</button>
          </div>

        </td>
      </tr>

      <tr *ngIf="data.length === 0">
        <td [attr.colspan]="columns.length"
            class="px-5 py-5 border-b border-gray-200 text-sm text-center text-gray-500">
          No data available
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Pagination -->
  <div class="px-5 py-5 bg-white border-t flex flex-col xs:flex-row items-center xs:justify-between">
    <span class="text-xs xs:text-sm text-gray-900">
      Showing {{ (page - 1) * limit + 1 }} to {{ min(page * limit, total) }} of {{ total }} Entries
    </span>

    <div class="inline-flex mt-2 xs:mt-0 gap-1">
      <button (click)="onPageChange(page - 1)" [disabled]="page === 1"
              class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded-l
                     disabled:opacity-50 disabled:cursor-not-allowed">
        Prev
      </button>
      <button (click)="onPageChange(page + 1)" [disabled]="page * limit >= total"
              class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded-r
                     disabled:opacity-50 disabled:cursor-not-allowed">
        Next
      </button>
    </div>
  </div>
</div>
